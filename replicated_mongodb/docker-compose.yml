# version: "3.2"

services:
  mongo1:
    image: mongo
    # restart: no
    container_name: mongo1
    ports:
      - 27017:27017
    restart: always
    command: mongod --replSet my-mongo-set
    volumes:
      - ./db_data1/:/data/db/

  mongo2:
    image: mongo
    # restart: no
    container_name: mongo2
    ports:
      - 27018:27017
    restart: always
    command: mongod --replSet my-mongo-set
    volumes:
      - ./db_data2/:/data/db/

  mongo3:
    image: mongo
    # restart: no
    container_name: mongo3
    ports:
      - 27019:27017
    restart: always
    command: mongod --replSet my-mongo-set
    volumes:
      - ./db_data3/:/data/db/